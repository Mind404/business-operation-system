{% extends "base.html" %}
{% block title %}导入结果 - 业务高效运转系统{% endblock %}
{% block content %}
<div class="page-header">
    <h1>导入结果</h1>
</div>

<div class="result-card {% if success %}result-success{% else %}result-error{% endif %}">
    <div class="result-icon">{% if success %}✅{% else %}❌{% endif %}</div>
    <div class="result-title">{% if success %}导入完成{% else %}导入失败{% endif %}</div>
    <div class="result-message">{{ message }}</div>
    <div class="result-actions">
        <a href="{{ url_for('data_import') }}" class="btn btn-primary">继续导入</a>
        <a href="{{ url_for('data_management') }}" class="btn btn-secondary">返回数据管理</a>
    </div>
</div>

<style>
.result-card { max-width: 600px; margin: 40px auto; padding: 48px; border-radius: 16px; text-align: center; }
.result-success { background: linear-gradient(135deg, #f0fdf4, #dcfce7); border: 2px solid #86efac; }
.result-error { background: linear-gradient(135deg, #fef2f2, #fee2e2); border: 2px solid #fca5a5; }
.result-icon { font-size: 48px; margin-bottom: 16px; }
.result-title { font-size: 24px; font-weight: 600; margin-bottom: 12px; color: #1f2937; }
.result-message { font-size: 15px; color: #4b5563; line-height: 1.6; margin-bottom: 32px; }
.result-actions { display: flex; gap: 12px; justify-content: center; }
.btn { padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; text-decoration: none; display: inline-block; }
.btn-primary { background: #2563eb; color: white; }
.btn-primary:hover { background: #1d4ed8; }
.btn-secondary { background: rgba(255,255,255,0.8); color: #374151; }
.btn-secondary:hover { background: white; }
</style>
{% endblock %}
