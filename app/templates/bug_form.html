{% extends "base.html" %}
{% block title %}登记Bug - 业务运转系统{% endblock %}
{% block page_title %}登记Bug{% endblock %}

{% block content %}
<div class="panel">
    <form method="post" class="form-grid">
        <div class="form-group">
            <label>关联产品</label>
            <select name="product_id" class="form-control" onchange="filterVersions(this.value)">
                <option value="">-- 选择产品 --</option>
                {% for p in products %}
                <option value="{{ p.id }}">{{ p.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>关联版本</label>
            <select name="version_id" id="versionSelect" class="form-control">
                <option value="">-- 选择版本 --</option>
                {% for v in versions %}
                <option value="{{ v.id }}" data-product="{{ v.product_id }}">{{ v.version_no }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Bug标题 *</label>
            <input type="text" name="title" required class="form-control" placeholder="简要描述Bug现象">
        </div>
        <div class="form-group">
            <label>Bug类型</label>
            <select name="bug_type" class="form-control">
                <option value="功能Bug" selected>功能Bug</option>
                <option value="性能Bug">性能Bug</option>
                <option value="UI/UX Bug">UI/UX Bug</option>
                <option value="安全Bug">安全Bug</option>
                <option value="兼容性Bug">兼容性Bug</option>
                <option value="文档Bug">文档Bug</option>
                <option value="其他">其他</option>
            </select>
        </div>
        <div class="form-group">
            <label>严重程度</label>
            <select name="severity" class="form-control">
                <option value="致命">致命</option>
                <option value="严重">严重</option>
                <option value="一般" selected>一般</option>
                <option value="轻微">轻微</option>
                <option value="建议">建议</option>
            </select>
        </div>
        <div class="form-group">
            <label>优先级</label>
            <select name="priority" class="form-control">
                <option value="紧急">紧急 - 立即处理</option>
                <option value="高">高 - 本版本修复</option>
                <option value="中" selected>中 - 计划修复</option>
                <option value="低">低 - 可选修复</option>
            </select>
        </div>
        <div class="form-group">
            <label>报告人</label>
            <input type="text" name="reporter" class="form-control" placeholder="报告人姓名">
        </div>
        <div class="form-group">
            <label>负责人</label>
            <input type="text" name="assignee" class="form-control" placeholder="处理负责人">
        </div>
        <div class="form-group">
            <label>发现日期</label>
            <input type="date" name="discovered_at" class="form-control">
        </div>
        <div class="form-group form-full">
            <label>Bug详细描述</label>
            <textarea name="description" rows="4" class="form-control" placeholder="详细描述Bug的复现步骤、预期结果、实际结果"></textarea>
        </div>
        <div class="form-actions form-full">
            <button type="submit" class="btn btn-primary">提交Bug</button>
            <a href="{{ url_for('bug_list') }}" class="btn btn-secondary">返回列表</a>
        </div>
    </form>
</div>

<style>
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.form-full { grid-column: 1 / -1; }
.form-group label { display: block; font-weight: 500; margin-bottom: 6px; color: #374151; font-size: 14px; }
.form-control { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
.form-control:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
.form-actions { display: flex; gap: 12px; }
.btn { padding: 10px 24px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; text-decoration: none; display: inline-block; }
.btn-primary { background: #2563eb; color: white; }
.btn-secondary { background: #f3f4f6; color: #374151; }
</style>

<script>
function filterVersions(productId) {
    const select = document.getElementById('versionSelect');
    const options = select.querySelectorAll('option');
    options.forEach(opt => {
        if (opt.value === '' || opt.dataset.product === productId) {
            opt.style.display = '';
        } else {
            opt.style.display = 'none';
        }
    });
    select.value = '';
}
</script>
{% endblock %}
