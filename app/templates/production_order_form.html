{% extends "base.html" %}
{% block title %}新建生产订单 - 业务运转系统{% endblock %}
{% block page_title %}新建生产订单{% endblock %}

{% block content %}
<div class="panel form-panel">
    <div class="form-tip" style="background:#eff6ff; border-left:4px solid #3b82f6; padding:12px 16px; margin-bottom:20px; border-radius:4px;">
        <strong style="color:#1e40af;">💡 提示：</strong>
        <span style="color:#374151;">选择"关联排程"后，系统会自动填充产品、需求、生产数量、计划时间等信息，实现规划与执行的打通。</span>
    </div>
    <form method="post" class="form-grid">
        <div class="form-group form-full">
            <label>关联生产排程（选填，选择后自动填充下方信息）</label>
            <select name="schedule_id" id="schedule_id">
                <option value="">-- 不关联排程，手动填写 --</option>
                {% for s in schedules %}
                <option value="{{ s.id }}">{{ s.schedule_no }}（产品ID: {{ s.product_id }}）</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>关联产品</label>
            <select name="product_id">
                <option value="">-- 请选择 --</option>
                {% for p in products %}
                <option value="{{ p.id }}">{{ p.name }} ({{ p.model or '' }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>关联需求</label>
            <select name="requirement_id">
                <option value="">-- 请选择 --</option>
                {% for r in requirements %}
                <option value="{{ r.id }}">{{ r.title }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>生产供应商</label>
            <input type="text" name="supplier" placeholder="供应商名称">
        </div>
        <div class="form-group">
            <label>生产数量</label>
            <input type="number" name="quantity" value="0" min="0">
        </div>
        <div class="form-group">
            <label>计划开始日期</label>
            <input type="date" name="plan_start">
        </div>
        <div class="form-group">
            <label>计划完成日期</label>
            <input type="date" name="plan_finish">
        </div>
        <div class="form-group">
            <label>订单状态</label>
            <select name="status">
                <option value="待排产">待排产</option>
                <option value="生产中">生产中</option>
                <option value="已完成">已完成</option>
            </select>
        </div>
        <div class="form-group form-full">
            <label>备注</label>
            <textarea name="remark" rows="2" placeholder="特殊要求、注意事项等"></textarea>
        </div>
        <div class="form-actions form-full">
            <a href="{{ url_for('production_dashboard', tab='orders') }}" class="btn btn-outline">取消</a>
            <button type="submit" class="btn btn-primary">创建生产订单</button>
        </div>
    </form>
</div>
{% endblock %}
