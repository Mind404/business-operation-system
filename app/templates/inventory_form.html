{% extends "base.html" %}
{% block title %}{{ '编辑库存' if item else '新增库存' }} - 业务运转系统{% endblock %}
{% block page_title %}{{ '编辑库存' if item else '新增库存' }}{% endblock %}

{% block content %}
<div class="panel form-panel">
    <form method="post" class="form-grid">
        <div class="form-group">
            <label>物料名称 <span class="required">*</span></label>
            <input type="text" name="material_name" required value="{{ item.material_name if item else '' }}">
        </div>
        <div class="form-group">
            <label>物料编码</label>
            <input type="text" name="material_code" value="{{ item.material_code if item else '' }}">
        </div>
        <div class="form-group">
            <label>是否关键物料</label>
            <label class="checkbox-label">
                <input type="checkbox" name="is_key_material" value="1" {% if item and item.is_key_material %}checked{% endif %}>
                关键物料（公司自供）
            </label>
        </div>
        <div class="form-group">
            <label>库位</label>
            <select name="location">
                <option value="公司库房" {% if item and item.location == '公司库房' %}selected{% endif %}>公司库房</option>
                <option value="供应商暂存" {% if item and item.location == '供应商暂存' %}selected{% endif %}>供应商暂存</option>
                <option value="在途" {% if item and item.location == '在途' %}selected{% endif %}>在途</option>
            </select>
        </div>
        <div class="form-group">
            <label>数量</label>
            <input type="number" name="quantity" value="{{ item.quantity if item else 0 }}" min="0">
        </div>
        <div class="form-group">
            <label>单位</label>
            <input type="text" name="unit" value="{{ item.unit if item else '个' }}">
        </div>
        <div class="form-group">
            <label>状态</label>
            <select name="status">
                <option value="正常" {% if item and item.status == '正常' %}selected{% endif %}>正常</option>
                <option value="待检" {% if item and item.status == '待检' %}selected{% endif %}>待检</option>
                <option value="冻结" {% if item and item.status == '冻结' %}selected{% endif %}>冻结</option>
            </select>
        </div>
        <div class="form-group form-full">
            <label>备注</label>
            <textarea name="remark" rows="2">{{ item.remark if item else '' }}</textarea>
        </div>
        <div class="form-actions form-full">
            <a href="{{ url_for('production_dashboard', tab='inventory') }}" class="btn btn-outline">取消</a>
            <button type="submit" class="btn btn-primary">保存</button>
        </div>
    </form>
</div>
{% endblock %}
