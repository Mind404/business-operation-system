{% extends "base.html" %}
{% block title %}入库申请 - 业务运转系统{% endblock %}
{% block page_title %}入库申请{% endblock %}

{% block content %}
<div class="panel form-panel">
    <form method="post" class="form-grid">
        <div class="form-group">
            <label>关联生产订单</label>
            <select name="production_order_id">
                <option value="">-- 请选择 --</option>
                {% for o in orders %}
                <option value="{{ o.id }}">{{ o.order_no }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>关联产品</label>
            <select name="product_id">
                <option value="">-- 请选择 --</option>
                {% for p in products %}
                <option value="{{ p.id }}">{{ p.name }} ({{ p.model or '' }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>入库数量</label>
            <input type="number" name="quantity" value="0" min="0">
        </div>
        <div class="form-group">
            <label>质量状态</label>
            <select name="quality_status">
                <option value="合格">合格</option>
                <option value="让步接收">让步接收</option>
                <option value="待复检">待复检</option>
            </select>
        </div>
        <div class="form-group">
            <label>审批人</label>
            <input type="text" name="approver" placeholder="质量部门审批人">
        </div>
        <div class="form-actions form-full">
            <a href="{{ url_for('delivery.delivery_dashboard', tab='receipts') }}" class="btn btn-outline">取消</a>
            <button type="submit" class="btn btn-primary">提交入库申请</button>
        </div>
    </form>
</div>
{% endblock %}
