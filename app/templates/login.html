<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 业务运转系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #60a5fa 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            padding: 40px;
            width: 400px;
            max-width: 90%;
        }
        .login-header { text-align: center; margin-bottom: 32px; }
        .login-logo {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #3b82f6, #1e40af);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
            font-size: 32px;
        }
        .login-title { font-size: 22px; font-weight: 700; color: #111827; margin-bottom: 6px; }
        .login-subtitle { font-size: 14px; color: #6b7280; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; font-size: 14px; font-weight: 500;
            color: #374151; margin-bottom: 8px;
        }
        .form-control {
            width: 100%; padding: 12px 16px;
            border: 1px solid #d1d5db; border-radius: 8px;
            font-size: 15px; transition: all 0.2s;
        }
        .form-control:focus {
            outline: none; border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        .btn-login {
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: all 0.2s;
        }
        .btn-login:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,0.4); }
        .error-box {
            background: #fef2f2; border: 1px solid #fecaca;
            color: #991b1b; padding: 12px 16px; border-radius: 8px;
            font-size: 14px; margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">⚙️</div>
            <div class="login-title">业务高效运转系统</div>
            <div class="login-subtitle">单点登录 · 信息聚合 · 统一权限</div>
        </div>

        {% if error %}
        <div class="error-box">{{ error }}</div>
        {% endif %}

        {% with msgs = get_flashed_messages(with_categories=true) %}
        {% if msgs %}
        <div style="margin:0 0 14px;">
          {% for cat, m in msgs %}
          <div style="padding:10px 12px;border-radius:6px;font-size:13px;line-height:1.6;margin-bottom:6px;
                      background:{{ '#fffbeb' if cat == 'warning' else '#fef2f2' if cat == 'error' else '#ecfdf5' }};
                      color:{{ '#92400e' if cat == 'warning' else '#991b1b' if cat == 'error' else '#065f46' }};
                      border:1px solid {{ '#fcd34d' if cat == 'warning' else '#fca5a5' if cat == 'error' else '#a7f3d0' }};">{{ m }}</div>
          {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
        <form method="post" action="{{ url_for('login') }}">
            <input type="hidden" name="next" value="{{ next }}">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" class="form-control" placeholder="请输入用户名" required autofocus>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn-login">登 录</button>
        </form>
    </div>
</body>
</html>
