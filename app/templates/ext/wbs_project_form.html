{% extends "base.html" %}
{% block title %}{{ '编辑' if p else '新建' }}WBS项目 - 业务高效运转系统{% endblock %}
{% block content %}
<div class="page-header"><h1>{% if p %}✏️ 编辑项目{% else %}➕ 新建WBS项目{% endif %}</h1></div>
<form method="post" style="max-width:680px;background:#fff;padding:24px;border-radius:8px;border:1px solid #e0e4ea;">
    <div style="margin-bottom:14px;">
        <label style="display:block;font-size:13px;color:#555;margin-bottom:4px;">项目名称 *</label>
        <input type="text" name="name" value="{{ p.name if p else '' }}" required placeholder="如：窄带切换性能优化" style="width:100%;padding:8px;border:1px solid #ccd;border-radius:6px;font-size:13px;">
    </div>
    <div style="margin-bottom:14px;">
        <label style="display:block;font-size:13px;color:#555;margin-bottom:4px;">项目描述</label>
        <textarea name="description" rows="2" style="width:100%;padding:8px;border:1px solid #ccd;border-radius:6px;font-size:13px;">{{ p.description if p else '' }}</textarea>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:18px;">
        <div>
            <label style="display:block;font-size:13px;color:#555;margin-bottom:4px;">负责人</label>
            <input type="text" name="owner" value="{{ p.owner if p else '' }}" style="width:100%;padding:8px;border:1px solid #ccd;border-radius:6px;font-size:13px;">
        </div>
        <div>
            <label style="display:block;font-size:13px;color:#555;margin-bottom:4px;">开始日期</label>
            <input type="date" name="start_date" value="{{ p.start_date if p else '' }}" style="width:100%;padding:8px;border:1px solid #ccd;border-radius:6px;font-size:13px;">
        </div>
        <div>
            <label style="display:block;font-size:13px;color:#555;margin-bottom:4px;">结束日期</label>
            <input type="date" name="end_date" value="{{ p.end_date if p else '' }}" style="width:100%;padding:8px;border:1px solid #ccd;border-radius:6px;font-size:13px;">
        </div>
    </div>
    <div style="display:flex;gap:10px;">
        <button type="submit" style="padding:9px 24px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;">保存</button>
        <a href="{{ url_for('ext.wbs_projects') }}" style="padding:9px 24px;background:#eef2f7;border:1px solid #ccd;border-radius:6px;text-decoration:none;color:#333;font-size:14px;">取消</a>
    </div>
</form>
{% endblock %}
