{% extends "base.html" %}
{% block title %}编辑任务 - WBS{% endblock %}
{% block content %}
<div style="margin-bottom:14px;">
    <a href="{{ url_for('ext.wbs_project_detail', pid=t.project_id) }}" style="color:#2563eb;text-decoration:none;font-size:13px;">← 返回项目</a>
</div>
<div class="page-header"><h1>✏️ 编辑任务 {{ t.wbs_code }}</h1></div>

<form method="post" enctype="multipart/form-data" style="max-width:860px;background:#fff;padding:24px;border-radius:8px;border:1px solid #e0e4ea;">
    <div style="display:grid;grid-template-columns:80px 1fr 1fr;gap:12px;margin-bottom:14px;">
        <div>
            <label style="display:block;font-size:12px;color:#666;margin-bottom:4px;">WBS编号</label>
            <input name="wbs_code" value="{{ t.wbs_code }}" style="width:100%;padding:8px;border:1px solid #ccd;border-radius:6px;font-size:13px;">
        </div>
        <div style="grid-column:span 2;">
            <label style="display:block;font-size:12px;color:#666;margin-bottom:4px;">任务名称 *</label>
            <input name="name" value="{{ t.name }}" required style="width:100%;padding:8px;border:1px solid #ccd;border-radius:6px;font-size:13px;">
        </div>
    </div>

    <div style="margin-bottom:14px;">
        <label style="display:block;font-size:12px;color:#666;margin-bottom:4px;">工作内容</label>
        <textarea name="work_content" rows="2" style="width:100%;padding:8px;border:1px solid #ccd;border-radius:6px;font-size:13px;">{{ t.work_content }}</textarea>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px;">
        <div>
            <label style="display:block;font-size:12px;color:#666;margin-bottom:4px;">责任人</label>
            <input name="owner" value="{{ t.owner or '' }}" style="width:100%;padding:8px;border:1px solid #ccd;border-radius:6px;font-size:13px;">
        </div>
        <div>
            <label style="display:block;font-size:12px;color:#666;margin-bottom:4px;">参与人</label>
            <input name="collaborators" value="{{ t.collaborators or '' }}" style="width:100%;padding:8px;border:1px solid #ccd;border-radius:6px;font-size:13px;">
        </div>
        <div>
            <label style="display:block;font-size:12px;color:#666;margin-bottom:4px;">任务等级</label>
            <select name="priority" style="width:100%;padding:8px;border:1px solid #ccd;border-radius:6px;font-size:13px;">
                {% for p in ['P0紧急','P1高','P2中','P3低'] %}
                <option value="{{ p }}" {% if t.priority==p %}selected{% endif %}>{{ p }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;margin-bottom:14px;">
        <div>
            <label style="display:block;font-size:12px;color:#666;margin-bottom:4px;">计划开始</label>
            <input type="date" name="plan_start" value="{{ t.plan_start or '' }}" style="width:100%;padding:8px;border:1px solid #ccd;border-radius:6px;font-size:13px;">
        </div>
        <div>
            <label style="display:block;font-size:12px;color:#666;margin-bottom:4px;">计划结束</label>
            <input type="date" name="plan_end" value="{{ t.plan_end or '' }}" style="width:100%;padding:8px;border:1px solid #ccd;border-radius:6px;font-size:13px;">
        </div>
        <div>
            <label style="display:block;font-size:12px;color:#666;margin-bottom:4px;">状态</label>
            <select name="status" style="width:100%;padding:8px;border:1px solid #ccd;border-radius:6px;font-size:13px;">
                {% for s in ['未开始','进行中','已完成','阻塞'] %}
                <option value="{{ s }}" {% if t.status==s %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label style="display:block;font-size:12px;color:#666;margin-bottom:4px;">进度 {{ t.progress }}%</label>
            <input type="range" name="progress" min="0" max="100" value="{{ t.progress }}" style="width:100%;margin-top:10px;">
        </div>
    </div>

    <div style="margin-bottom:14px;">
        <label style="display:block;font-size:12px;color:#666;margin-bottom:4px;">交付物说明 / 判定标准</label>
        <input name="deliverable" value="{{ t.deliverable or '' }}" placeholder="如：数据统计表/比对报告" style="width:100%;padding:8px;border:1px solid #ccd;border-radius:6px;font-size:13px;">
    </div>

    <div style="margin-bottom:20px;">
        <label style="display:block;font-size:12px;color:#666;margin-bottom:4px;">交付物文件</label>
        {% if t.attachment_path %}
        <div style="margin-bottom:8px;font-size:13px;">
            📎 <a href="{{ url_for('ext.wbs_download', filename=t.attachment_path) }}" style="color:#2563eb;">{{ t.attachment_path.split('/')[-1] }}</a>
        </div>
        {% endif %}
        <input type="file" name="attachment" style="font-size:13px;">
    </div>

    <div style="display:flex;gap:10px;">
        <button type="submit" style="padding:9px 24px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;">保存</button>
        <a href="{{ url_for('ext.wbs_project_detail', pid=t.project_id) }}" style="padding:9px 24px;background:#eef2f7;border:1px solid #ccd;border-radius:6px;text-decoration:none;color:#333;font-size:14px;">取消</a>
    </div>
</form>
{% endblock %}
