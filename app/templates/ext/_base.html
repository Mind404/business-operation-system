{% extends "base.html" %}
{% block title %}{{ page_title }} - 业务运转系统{% endblock %}
{% block page_title %}{{ page_title }}{% endblock %}

{% block content %}
{% block ext_content %}{% endblock %}
{% endblock %}

{% block scripts %}
<style>
/* 通用列表样式 */
.filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.filter-tag { padding: 6px 14px; border-radius: 20px; font-size: 13px; color: #6b7280; background: #f3f4f6; text-decoration: none; transition: all 0.15s; }
.filter-tag:hover { background: #e5e7eb; }
.filter-tag.active { background: #3b82f6; color: white; }
.filter-desc { font-size: 13px; color: #9ca3af; margin-left: auto; }

.search-bar { margin-bottom: 16px; }
.search-bar form { display: flex; align-items: center; gap: 10px; }
.search-input { flex: 1; max-width: 400px; padding: 8px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
.search-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
.search-btn { padding: 8px 20px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
.search-btn:hover { background: #2563eb; }
.search-clear { font-size: 13px; color: #6b7280; text-decoration: none; }
.search-count { font-size: 13px; color: #9ca3af; margin-left: auto; }

.pagination { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; margin-top: 8px; }
.page-info { font-size: 13px; color: #6b7280; }
.page-buttons { display: flex; gap: 6px; }
.page-btn { padding: 6px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; color: #374151; text-decoration: none; background: white; }
.page-btn:hover { border-color: #3b82f6; color: #3b82f6; }
.page-active { background: #3b82f6; color: white; border-color: #3b82f6; }
.page-ellipsis { padding: 6px 4px; color: #9ca3af; }

/* 表单分步 */
.step-indicator { display: flex; align-items: center; justify-content: center; padding: 20px 0; margin-bottom: 20px; border-bottom: 1px solid #f3f4f6; }
.step-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.step-num { width: 32px; height: 32px; border-radius: 50%; background: #e5e7eb; color: #9ca3af; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; }
.step-item.active .step-num { background: #3b82f6; color: white; }
.step-item.done .step-num { background: #10b981; color: white; }
.step-label { font-size: 12px; color: #9ca3af; }
.step-item.active .step-label { color: #3b82f6; }
.step-line { width: 60px; height: 2px; background: #e5e7eb; margin: 0 10px; margin-bottom: 18px; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.form-full { grid-column: 1 / -1; }
.form-group label { display: block; font-weight: 500; margin-bottom: 6px; color: #374151; font-size: 14px; }
.form-control { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
.form-control:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
.required { color: #dc2626; }
.step-actions { display: flex; gap: 12px; justify-content: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid #f3f4f6; }
.btn { padding: 10px 24px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; text-decoration: none; display: inline-block; }
.btn-primary { background: #2563eb; color: white; }
.btn-primary:hover { background: #1d4ed8; }
.btn-success { background: #10b981; }
.btn-success:hover { background: #059669; }
.btn-secondary { background: #f3f4f6; color: #374151; }
.btn-secondary:hover { background: #e5e7eb; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-outline { background: white; border: 1px solid #d1d5db; color: #374151; }
.btn-outline:hover { border-color: #3b82f6; color: #3b82f6; }

/* 状态标签 */
.status-tag { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
.status-待处理, .status-待评审, .status-计划中, .status-规划中, .status-草稿, .status-未激活, .status-待升级, .status-待确认 { background: #f3f4f6; color: #6b7280; }
.status-处理中, .status-进行中, .status-开发中, .status-生产中, .status-执行中, .status-已分配 { background: #dbeafe; color: #1e40af; }
.status-测试中, .status-已评审, .status-待验证 { background: #fef3c7; color: #92400e; }
.status-已完成, .status-已发布, .status-已解决, .status-已确认, .status-量产中, .status-合格, .status-在线, .status-已激活 { background: #d1fae5; color: #065f46; }
.status-已关闭, .status-已取消, .status-维护中, .status-离线 { background: #e0e7ff; color: #3730a3; }
.status-阻塞, .status-失败, .status-不合格 { background: #fee2e2; color: #991b1b; }

.priority { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
.priority-高, .priority-致命, .priority-严重 { background: #fee2e2; color: #991b1b; }
.priority-中, .priority-一般 { background: #fef3c7; color: #92400e; }
.priority-低, .priority-轻微 { background: #d1fae5; color: #065f46; }

/* 统计卡片 */
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-mini { background: white; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; text-align: center; }
.stat-mini-value { font-size: 28px; font-weight: 700; color: #111827; }
.stat-mini-label { font-size: 12px; color: #6b7280; margin-top: 4px; }
.stat-mini-blue { border-top: 3px solid #3b82f6; }
.stat-mini-green { border-top: 3px solid #10b981; }
.stat-mini-orange { border-top: 3px solid #f59e0b; }
.stat-mini-red { border-top: 3px solid #ef4444; }

/* 详情页 */
.detail-section { margin-bottom: 24px; }
.detail-section h3 { font-size: 15px; font-weight: 600; color: #374151; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #f3f4f6; }
.detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 24px; }
.detail-item { display: flex; gap: 8px; font-size: 13px; }
.detail-label { color: #6b7280; min-width: 80px; }
.detail-value { color: #111827; font-weight: 500; }
.detail-full { grid-column: 1 / -1; }
.workflow-item { display: flex; gap: 12px; padding: 12px; background: #f9fafb; border-radius: 8px; margin-bottom: 8px; }
.workflow-action { font-weight: 600; color: #374151; min-width: 60px; }
.workflow-time { font-size: 12px; color: #9ca3af; margin-left: auto; }

.empty-cell { text-align: center; color: #9ca3af; padding: 24px !important; }
.mono { font-family: monospace; }
.text-center { text-align: center; }
.text-danger { color: #dc2626; font-weight: 500; }
.text-success { color: #059669; font-weight: 500; }
</style>
{% endblock %}
