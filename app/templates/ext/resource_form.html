{% extends "ext/_base.html" %}
{% set page_title = '新建资源调度' %}
{% block ext_content %}
<div class="module-tabs">
    <a href="{{ url_for('production_dashboard') }}" class="module-tab">🏭 生产管理</a>
    <a href="{{ url_for('ext.resource_list') }}" class="module-tab active">🔧 资源调度</a>
</div>
<div class="panel">
    <form method="post">
        <div class="form-grid">
            <div class="form-group">
                <label>资源类型 <span class="required">*</span></label>
                <select name="resource_type" required class="form-control">
                    <option>人力资源</option><option>物料资源</option><option>设备资源</option><option>其他</option>
                </select>
            </div>
            <div class="form-group">
                <label>资源名称 <span class="required">*</span></label>
                <input type="text" name="resource_name" required class="form-control" placeholder="如：张三 / SMT产线 / 关键物料A">
            </div>
            <div class="form-group">
                <label>所属项目</label>
                <input type="text" name="project" class="form-control" placeholder="选填">
            </div>
            <div class="form-group">
                <label>具体任务</label>
                <input type="text" name="task" class="form-control" placeholder="选填">
            </div>
            <div class="form-group">
                <label>开始日期</label>
                <input type="date" name="start_date" class="form-control">
            </div>
            <div class="form-group">
                <label>结束日期</label>
                <input type="date" name="end_date" class="form-control">
            </div>
            <div class="form-group">
                <label>分配比例（%）</label>
                <input type="number" name="allocation" min="1" max="100" value="100" class="form-control">
            </div>
            <div class="form-group">
                <label>负责人</label>
                <input type="text" name="owner" value="product_a" class="form-control">
            </div>
            <div class="form-group form-full">
                <label>备注</label>
                <textarea name="remark" rows="2" class="form-control" placeholder="选填"></textarea>
            </div>
        </div>
        <div class="step-actions">
            <button type="submit" class="btn btn-primary">创建调度</button>
            <a href="{{ url_for('ext.resource_list') }}" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>
{% endblock %}
