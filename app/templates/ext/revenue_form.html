{% extends "ext/_base.html" %}
{% set page_title = '新增收入确认' %}
{% block ext_content %}
<div class="module-tabs">
    <a href="{{ url_for('ext.delivery_plan_list') }}" class="module-tab">📦 交付跟踪</a>
    <a href="{{ url_for('ext.revenue_list') }}" class="module-tab active">💰 收入确认</a>
</div>
<div class="panel">
    <form method="post">
        <div class="form-grid">
            <div class="form-group">
                <label>客户名称 <span class="required">*</span></label>
                <input type="text" name="customer" required class="form-control" placeholder="客户名称">
            </div>
            <div class="form-group">
                <label>合同编号</label>
                <input type="text" name="contract_no" class="form-control" placeholder="选填">
            </div>
            <div class="form-group">
                <label>涉及产品</label>
                <select name="product_id" class="form-control">
                    <option value="">-- 选择产品（选填）--</option>
                    {% for p in products %}
                    <option value="{{ p.id }}">{{ p.name }} ({{ p.model }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>合同总金额（元） <span class="required">*</span></label>
                <input type="number" name="amount" required step="0.01" min="0" class="form-control" placeholder="0.00">
            </div>
            <div class="form-group">
                <label>确认期间</label>
                <input type="text" name="period" class="form-control" placeholder="如：2026年Q3">
            </div>
            <div class="form-group">
                <label>负责人</label>
                <input type="text" name="handler" value="delivery_a" class="form-control">
            </div>
            <div class="form-group form-full">
                <label>备注</label>
                <textarea name="remark" rows="2" class="form-control" placeholder="选填"></textarea>
            </div>
        </div>
        <div class="step-actions">
            <button type="submit" class="btn btn-primary">创建确认单</button>
            <a href="{{ url_for('ext.revenue_list') }}" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>
{% endblock %}
