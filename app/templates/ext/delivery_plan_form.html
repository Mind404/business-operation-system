{% extends "ext/_base.html" %}
{% set page_title = '新建交付计划' %}
{% block ext_content %}
<div class="panel">
    <form method="post">
        <div class="form-grid">
            <div class="form-group">
                <label>客户名称 <span class="required">*</span></label>
                <input type="text" name="customer" required class="form-control" placeholder="交付客户">
            </div>
            <div class="form-group">
                <label>交付产品 <span class="required">*</span></label>
                <select name="product_id" required class="form-control">
                    <option value="">-- 选择产品 --</option>
                    {% for p in products %}
                    <option value="{{ p.id }}">{{ p.name }} ({{ p.model }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>交付数量（套） <span class="required">*</span></label>
                <input type="number" name="quantity" required min="1" value="1" class="form-control">
            </div>
            <div class="form-group">
                <label>计划交付日期 <span class="required">*</span></label>
                <input type="date" name="planned_date" required class="form-control">
            </div>
            <div class="form-group">
                <label>负责人</label>
                <input type="text" name="owner" value="delivery_a" class="form-control">
            </div>
            <div class="form-group form-full">
                <label>备注</label>
                <textarea name="remark" rows="2" class="form-control" placeholder="交付注意事项、特殊要求等（选填）"></textarea>
            </div>
        </div>
        <div class="step-actions">
            <button type="submit" class="btn btn-primary">创建交付计划</button>
            <a href="{{ url_for('ext.delivery_plan_list') }}" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>
{% endblock %}
