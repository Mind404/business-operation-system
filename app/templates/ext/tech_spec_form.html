{% extends "ext/_base.html" %}
{% set page_title = '新建技术规格' %}
{% block ext_content %}
<div class="module-tabs">
    <a href="{{ url_for('planning_list') }}" class="module-tab">📐 产品与版本规划</a>
    <a href="{{ url_for('ext.tech_spec_list') }}" class="module-tab active">📄 技术规格</a>
</div>
<div class="panel">
    <form method="post">
        <div class="step-indicator">
            <div class="step-item active"><div class="step-num">1</div><div class="step-label">基本信息</div></div>
            <div class="step-line"></div>
            <div class="step-item"><div class="step-num">2</div><div class="step-label">规格内容</div></div>
            <div class="step-line"></div>
            <div class="step-item"><div class="step-num">3</div><div class="step-label">接口性能</div></div>
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label>规格名称 <span class="required">*</span></label>
                <input type="text" name="spec_name" required class="form-control" placeholder="如：5G模组AT指令集规格">
            </div>
            <div class="form-group">
                <label>所属产品 <span class="required">*</span></label>
                <select name="product_id" required class="form-control">
                    <option value="">-- 选择产品 --</option>
                    {% for p in products %}
                    <option value="{{ p.id }}">{{ p.name }} ({{ p.model }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>关联版本</label>
                <select name="version_id" class="form-control">
                    <option value="">-- 选择版本（选填）--</option>
                    {% for v in versions %}
                    <option value="{{ v.id }}">{{ v.version_no }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>规格类型</label>
                <select name="spec_type" class="form-control">
                    <option>功能规格</option><option>接口规格</option><option>性能规格</option>
                    <option>硬件规格</option><option>软件规格</option><option>测试规格</option>
                </select>
            </div>
            <div class="form-group form-full">
                <label>规格内容描述 <span class="required">*</span></label>
                <textarea name="content" rows="4" required class="form-control" placeholder="详细描述该技术规格的内容、定义和范围"></textarea>
            </div>
            <div class="form-group form-full">
                <label>参数定义</label>
                <textarea name="parameters" rows="3" class="form-control" placeholder="列出关键参数及其取值范围、默认值（选填）"></textarea>
            </div>
            <div class="form-group form-full">
                <label>接口定义</label>
                <textarea name="interfaces" rows="3" class="form-control" placeholder="描述接口协议、命令格式、返回值等（选填）"></textarea>
            </div>
            <div class="form-group form-full">
                <label>性能指标</label>
                <textarea name="performance" rows="3" class="form-control" placeholder="描述性能指标，如响应时间、吞吐量、功耗等（选填）"></textarea>
            </div>
            <div class="form-group">
                <label>作者</label>
                <input type="text" name="author" value="product_b" class="form-control">
            </div>
        </div>
        <div class="step-actions">
            <button type="submit" class="btn btn-primary">保存规格（草稿）</button>
            <a href="{{ url_for('ext.tech_spec_list') }}" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>
{% endblock %}
