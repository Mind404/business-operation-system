{% extends "ext/_base.html" %}
{% set page_title = '记录用户反馈' %}
{% block ext_content %}
<div class="panel">
    <form method="post">
        <div class="form-grid">
            <div class="form-group">
                <label>客户名称 <span class="required">*</span></label>
                <input type="text" name="customer" required class="form-control" placeholder="反馈来源客户">
            </div>
            <div class="form-group">
                <label>涉及产品</label>
                <select name="product_id" class="form-control">
                    <option value="">-- 选择产品（选填）--</option>
                    {% for p in products %}
                    <option value="{{ p.id }}">{{ p.name }} ({{ p.model }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>反馈类型 <span class="required">*</span></label>
                <select name="feedback_type" required class="form-control">
                    <option>功能建议</option><option>深度需求</option><option>吐槽反馈</option><option>Bug反馈</option><option>其他</option>
                </select>
            </div>
            <div class="form-group">
                <label>优先级</label>
                <select name="priority" class="form-control">
                    <option>高</option><option selected>中</option><option>低</option>
                </select>
            </div>
            <div class="form-group form-full">
                <label>反馈标题 <span class="required">*</span></label>
                <input type="text" name="title" required class="form-control" placeholder="一句话概括反馈内容">
            </div>
            <div class="form-group form-full">
                <label>详细内容 <span class="required">*</span></label>
                <textarea name="content" rows="5" required class="form-control" placeholder="详细描述用户的反馈、建议或吐槽，包括使用场景和期望效果"></textarea>
            </div>
            <div class="form-group">
                <label>反馈来源</label>
                <select name="source" class="form-control">
                    <option>客户反馈</option><option>技术支持</option><option>现场交付</option><option>电话沟通</option><option>其他</option>
                </select>
            </div>
        </div>
        <div class="step-actions">
            <button type="submit" class="btn btn-primary">保存反馈</button>
            <a href="{{ url_for('ext.feedback_list') }}" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>
{% endblock %}
