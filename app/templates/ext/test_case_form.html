{% extends "ext/_base.html" %}
{% set page_title = '新增测试用例' %}
{% block ext_content %}
<div class="panel">
    <form method="post">
        <div class="step-indicator">
            <div class="step-item active"><div class="step-num">1</div><div class="step-label">基本信息</div></div>
            <div class="step-line"></div>
            <div class="step-item"><div class="step-num">2</div><div class="step-label">测试步骤</div></div>
            <div class="step-line"></div>
            <div class="step-item"><div class="step-num">3</div><div class="step-label">预期结果</div></div>
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label>用例编号</label>
                <input type="text" name="case_no" class="form-control" placeholder="留空自动生成">
            </div>
            <div class="form-group">
                <label>所属产品 <span class="required">*</span></label>
                <select name="product_id" required class="form-control">
                    <option value="">-- 选择产品 --</option>
                    {% for p in products %}
                    <option value="{{ p.id }}">{{ p.name }} ({{ p.model }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>用例标题 <span class="required">*</span></label>
                <input type="text" name="title" required class="form-control" placeholder="如：5G模组联网功能测试">
            </div>
            <div class="form-group">
                <label>所属模块</label>
                <input type="text" name="module" class="form-control" placeholder="如：联网模块、OTA模块">
            </div>
            <div class="form-group">
                <label>用例类型</label>
                <select name="case_type" class="form-control">
                    <option>功能测试</option><option>性能测试</option><option>兼容性测试</option>
                    <option>稳定性测试</option><option>安全测试</option><option>回归测试</option>
                </select>
            </div>
            <div class="form-group">
                <label>优先级</label>
                <select name="priority" class="form-control">
                    <option>高</option><option selected>中</option><option>低</option>
                </select>
            </div>
            <div class="form-group form-full">
                <label>前置条件</label>
                <textarea name="precondition" rows="2" class="form-control" placeholder="执行该用例前需要满足的条件（选填）"></textarea>
            </div>
            <div class="form-group form-full">
                <label>测试步骤 <span class="required">*</span></label>
                <textarea name="test_steps" rows="4" class="form-control" placeholder="每行一个步骤，如：&#10;1. 插入SIM卡&#10;2. 上电启动模组&#10;3. 发送AT指令查询网络状态"></textarea>
            </div>
            <div class="form-group form-full">
                <label>预期结果 <span class="required">*</span></label>
                <textarea name="expected_result" rows="3" class="form-control" placeholder="描述每个步骤对应的预期结果"></textarea>
            </div>
        </div>
        <div class="step-actions">
            <button type="submit" class="btn btn-primary">保存用例</button>
            <a href="{{ url_for('ext.test_case_list') }}" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>
{% endblock %}
