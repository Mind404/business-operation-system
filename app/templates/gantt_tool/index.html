<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目工作进度表-甘特图</title>
<link rel="stylesheet" href="/gantt_tool/style.css?v=2.2">
</head>
<body>

<header class="topbar">
  <h1>项目工作进度表-甘特图</h1>
  <div class="readonly-banner">📌 当前为只读模式（仅管理组和产品组可编辑），您可以查看和导出数据</div>
  <div class="toolbar">
    <button id="btnAdd" class="primary edit-action">＋ 添加项目</button>
    <button id="btnTutorial">📖 使用教程</button>
    <div class="btn-group" id="exportGroup">
      <button id="btnExport">⬇ 导出数据 ▾</button>
      <div class="export-menu" id="exportMenu" hidden>
        <button data-fmt="json">导出为 JSON 文件（.json）</button>
        <button data-fmt="excel">导出为 Excel 文件（.xlsx）</button>
      </div>
    </div>
    <button id="btnImport" class="edit-action">⬆ 导入数据</button>
    <input type="file" id="importFile" accept=".json,.xlsx,application/json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
    <button id="btnDemo" class="edit-action">示例数据</button>
    <button id="btnClear" class="danger edit-action">清空</button>
  </div>
</header>

<main class="page">

  <div class="main-layout">

    <!-- 左侧：任务名称分类面板 -->
    <aside class="card sidebar" id="sidebar">
      <div class="sidebar-head">
        <span class="sidebar-title">任务名称</span>
      </div>
      <div class="sidebar-list" id="sidebarList"></div>
    </aside>

    <!-- 右侧：主内容 -->
    <div class="content">

      <!-- 顶部：时间范围 + 统计卡片 + 环形图 -->
      <section class="summary">
        <div class="card date-card">
          <div class="card-title">计划时间范围</div>
          <div class="date-grid">
            <label class="field">开始日期
              <input type="date" id="startDate">
            </label>
            <label class="field">结束日期
              <input type="date" id="endDate">
            </label>
          </div>
          <label class="auto-check">
            <input type="checkbox" id="autoRange" checked>
            <span>自动范围（跟随项目起止）</span>
          </label>
          <div class="range-hint" id="rangeHint"></div>
        </div>

        <div class="stat-cards" id="statCards"></div>

        <div class="card donut-card">
          <svg id="donutSvg" viewBox="0 0 140 140" aria-label="项目完成率"></svg>
        </div>
      </section>

      <!-- 表格 + 甘特图 -->
      <section class="board card">
        <div class="board-scroll">
          <div class="board-flex">
            <div class="table-side">
              <table id="projectTable">
                <thead>
                  <tr>
                    <th class="c-no">序号</th>
                    <th class="c-done">是否完成</th>
                    <th class="c-name">工作项目名称</th>
                    <th class="c-date">开始日期</th>
                    <th class="c-date">结束日期</th>
                    <th class="c-type">分类</th>
                    <th class="c-op">操作</th>
                  </tr>
                </thead>
                <tbody id="tbody"></tbody>
              </table>
            </div>
            <div class="gantt-side">
              <div class="gantt-inner" id="ganttInner">
                <div class="gantt-axis" id="ganttAxis"></div>
                <div class="gantt-rows" id="ganttRows"></div>
              </div>
            </div>
          </div>
        </div>
        <!-- 固定底部横向滚动条（模块底部，始终可见） -->
        <div class="board-hbar" id="boardHbar" title="横向拖动查看甘特图时间轴">
          <div class="board-hbar-thumb" id="boardHbarThumb"></div>
        </div>
      </section>

      <footer class="foot-hint">
        数据保存在服务器端数据库，修改后自动保存；点击「导出数据」可下载备份，换电脑后「导入数据」即可恢复。
      </footer>

    </div>
  </div>
</main>

<!-- 添加/编辑弹窗 -->
<div class="modal-mask" id="modalMask" hidden>
  <div class="modal">
    <h3 id="modalTitle">添加项目</h3>
    <div class="form-grid">
      <label class="field span2">工作项目名称
        <input type="text" id="fName" maxlength="60" placeholder="例如：V1.3基础协议适配开发">
      </label>
      <label class="field">开始日期
        <input type="date" id="fStart">
      </label>
      <label class="field">结束日期
        <input type="date" id="fEnd">
      </label>
      <label class="field">分类
        <select id="fCategory">
          <option value="产品研发情况">产品研发情况</option>
          <option value="产品测试情况">产品测试情况</option>
          <option value="产品生产情况">产品生产情况</option>
        </select>
      </label>
      <label class="field check-field">
        <input type="checkbox" id="fDone">
        <span>是否已完成</span>
      </label>
    </div>
    <div class="modal-actions">
      <button id="btnCancel">取消</button>
      <button id="btnSave" class="primary">保存</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/gantt_tool/app.js?v=2.2"></script>
</body>
</html>
