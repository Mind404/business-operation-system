{% extends "base.html" %}
{% block title %}新增生产排程 - 业务运转系统{% endblock %}
{% block page_title %}新增生产排程{% endblock %}

{% block content %}
<div class="panel">
    <form method="post" class="form-grid">
        <div class="form-group">
            <label>生产产品 *</label>
            <select name="product_id" required class="form-control">
                <option value="">-- 选择产品 --</option>
                {% for p in products %}
                <option value="{{ p.id }}">{{ p.name }} ({{ p.model }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>关联需求 <span style="font-size:11px; color:#6b7280; font-weight:normal;">（仅显示用户需求-合同刚性，其他类型需求只影响软件版本）</span></label>
            <select name="requirement_id" class="form-control">
                <option value="">-- 选择关联用户需求 --</option>
                {% for r in requirements %}
                <option value="{{ r.id }}">{{ r.title }} ({{ r.quantity }}套, {{ r.delivery_date }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>生产数量 *</label>
            <input type="number" name="quantity" required min="1" class="form-control" placeholder="生产套数">
        </div>
        <div class="form-group">
            <label>刷新软件版本 <span style="font-size:11px; color:#6b7280; font-weight:normal;">（生产完成后模组刷新的固件版本）</span></label>
            <select name="version_id" class="form-control">
                <option value="">-- 选择刷新版本 --</option>
                {% for v in versions %}
                <option value="{{ v.id }}">{{ v.version_no }} - {{ v.version_name }} ({{ v.status }}){% if v.system_version %} [系统{{ v.system_version }}]{% endif %}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>计划开始日期</label>
            <input type="date" name="plan_start" class="form-control">
        </div>
        <div class="form-group">
            <label>计划完成日期</label>
            <input type="date" name="plan_finish" class="form-control">
        </div>
        <div class="form-group form-full">
            <label>备注</label>
            <textarea name="remark" rows="2" class="form-control" placeholder="排程备注说明"></textarea>
        </div>
        <div class="form-group form-full">
            <div class="auto-tip">
                <strong>⚡ 系统自动生成：</strong>
                ① 根据产品BOM表自动计算关键物料需求数量并查询库存状态；
                ② 自动生成6道标准工序（SMT贴片→回流焊接→AOI检测→功能测试→外观检验→包装入库）。
            </div>
        </div>
        <div class="form-actions form-full">
            <button type="submit" class="btn btn-primary">创建排程（自动生成物料和工序）</button>
            <a href="{{ url_for('production_dashboard') }}" class="btn btn-secondary">取消返回</a>
        </div>
    </form>
</div>

<style>
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.form-full { grid-column: 1 / -1; }
.form-group label { display: block; font-weight: 500; margin-bottom: 6px; color: #374151; font-size: 14px; }
.form-control { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
.form-control:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
.form-actions { display: flex; gap: 12px; }
.btn { padding: 10px 24px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; text-decoration: none; display: inline-block; }
.btn-primary { background: #2563eb; color: white; }
.btn-secondary { background: #f3f4f6; color: #374151; }
.auto-tip { background: #eff6ff; border: 1px solid #bfdbfe; padding: 12px 16px; border-radius: 8px; font-size: 13px; color: #1e40af; line-height: 1.8; }
</style>
{% endblock %}
