<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ plugin_name }} - 业务运转系统</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#f4f6fa;font-family:-apple-system,"Microsoft YaHei",sans-serif;}
  .shell-bar{
    height:46px;display:flex;align-items:center;gap:12px;padding:0 14px;
    background:#1f2d4d;color:#e8edf6;box-sizing:border-box;position:sticky;top:0;z-index:10;
  }
  .shell-bar .back{
    display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:6px;
    background:#3b6fd4;color:#fff;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap;
  }
  .shell-bar .back:hover{background:#4b7fe4;}
  .shell-bar .title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .shell-bar .spacer{flex:1;}
  .shell-bar .opt{font-size:12px;color:#c3cee4;text-decoration:none;padding:4px 8px;border-radius:5px;}
  .shell-bar .opt:hover{background:rgba(255,255,255,.12);color:#fff;}
  iframe{display:block;width:100%;height:calc(100vh - 46px);border:0;background:#fff;}
</style>
</head>
<body>
  <div class="shell-bar">
    <a class="back" href="/">← 返回平台</a>
    <span class="title">{{ plugin_icon }} {{ plugin_name }}</span>
    <span class="spacer"></span>
    <a class="opt" href="{{ home_url }}" target="_self">刷新</a>
    <a class="opt" href="{{ home_url }}" target="_blank" rel="noopener">新窗口打开</a>
  </div>
  <iframe src="{{ home_url }}" title="{{ plugin_name }}"></iframe>
</body>
</html>
