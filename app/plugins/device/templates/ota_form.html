{% extends "ext/_base.html" %}
{% set page_title = '上传OTA版本' %}
{% block ext_content %}
<div class="module-tabs">
    <a href="{{ url_for('device.device_center') }}" class="module-tab">📡 设备运维与OTA</a>
    <a href="{{ url_for('device.device_list') }}" class="module-tab active">🖥️ 设备监控</a>
    <a href="{{ url_for('device.ota_list') }}" class="module-tab">📦 OTA版本</a>
</div>
<div class="panel">
    <form method="post">
        <div class="step-indicator">
            <div class="step-item active"><div class="step-num">1</div><div class="step-label">版本信息</div></div>
            <div class="step-line"></div>
            <div class="step-item"><div class="step-num">2</div><div class="step-label">发布说明</div></div>
            <div class="step-line"></div>
            <div class="step-item"><div class="step-num">3</div><div class="step-label">发布策略</div></div>
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label>版本号 <span class="required">*</span></label>
                <input type="text" name="version_no" required class="form-control" placeholder="如：V2.3.0">
            </div>
            <div class="form-group">
                <label>适用产品 <span class="required">*</span></label>
                <select name="product_id" required class="form-control">
                    <option value="">-- 选择产品 --</option>
                    {% for p in products %}
                    <option value="{{ p.id }}">{{ p.name }} ({{ p.model }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>固件文件名</label>
                <input type="text" name="file_name" class="form-control" placeholder="如：firmware_v2.3.0.bin">
            </div>
            <div class="form-group">
                <label>文件大小（KB）</label>
                <input type="number" name="file_size" min="0" class="form-control" placeholder="选填">
            </div>
            <div class="form-group">
                <label>MD5校验值</label>
                <input type="text" name="md5" class="form-control" placeholder="选填，用于完整性校验">
            </div>
            <div class="form-group form-full">
                <label>发布说明 <span class="required">*</span></label>
                <textarea name="release_notes" rows="4" required class="form-control" placeholder="描述：&#10;1. 新增功能&#10;2. 修复的问题&#10;3. 已知限制&#10;4. 升级注意事项"></textarea>
            </div>
            <div class="form-group">
                <label>发布策略</label>
                <select name="rollout_strategy" class="form-control" id="strategySelect">
                    <option>全量发布</option><option>灰度发布</option><option>内测发布</option>
                </select>
            </div>
            <div class="form-group" id="percentageGroup" style="display:none;">
                <label>灰度比例（%）</label>
                <input type="number" name="rollout_percentage" min="1" max="99" value="10" class="form-control">
            </div>
            <div class="form-group">
                <label>创建人</label>
                <input type="text" name="creator" value="delivery_c" class="form-control">
            </div>
        </div>
        <div class="step-actions">
            <button type="submit" class="btn btn-primary">上传版本（测试中）</button>
            <a href="{{ url_for('device.ota_list') }}" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>
<script>
document.getElementById('strategySelect').addEventListener('change', function() {
    document.getElementById('percentageGroup').style.display = this.value === '灰度发布' ? 'block' : 'none';
});
</script>
{% endblock %}
