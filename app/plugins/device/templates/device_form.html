{% extends "ext/_base.html" %}
{% set page_title = '登记设备' %}
{% block ext_content %}
<div class="module-tabs">
    <a href="{{ url_for('device.device_center') }}" class="module-tab">📡 设备运维与OTA</a>
    <a href="{{ url_for('device.device_list') }}" class="module-tab active">🖥️ 设备监控</a>
    <a href="{{ url_for('device.ota_list') }}" class="module-tab">📦 OTA版本</a>
</div>
<div class="panel">
    <form method="post">
        <div class="form-grid">
            <div class="form-group">
                <label>设备SN <span class="required">*</span></label>
                <input type="text" name="device_sn" required class="form-control" placeholder="设备唯一序列号">
            </div>
            <div class="form-group">
                <label>产品型号 <span class="required">*</span></label>
                <select name="product_id" required class="form-control">
                    <option value="">-- 选择产品 --</option>
                    {% for p in products %}
                    <option value="{{ p.id }}">{{ p.name }} ({{ p.model }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>所属客户</label>
                <input type="text" name="customer" class="form-control" placeholder="选填">
            </div>
            <div class="form-group">
                <label>固件版本</label>
                <input type="text" name="firmware_version" class="form-control" placeholder="如：V1.2.3">
            </div>
            <div class="form-group">
                <label>部署位置</label>
                <input type="text" name="location" class="form-control" placeholder="如：重庆XX工厂车间A">
            </div>
            <div class="form-group form-full">
                <label>备注</label>
                <textarea name="remark" rows="2" class="form-control" placeholder="选填"></textarea>
            </div>
        </div>
        <div class="step-actions">
            <button type="submit" class="btn btn-primary">登记设备</button>
            <a href="{{ url_for('device.device_list') }}" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>
{% endblock %}
